name: build

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    # GitHub 的 macos-14 运行器为 Apple Silicon（M1）+ macOS 14
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version

      - name: 编译（debug）
        run: swift build

      - name: 单元测试
        run: swift test

      - name: 安装 rclone
        run: |
          brew install rclone
          rclone version

      - name: 端到端测试（真实 rclone bisync + 临时目录）
        run: python3 Tests/e2e/e2e.py --agent .build/debug/rclonebar-agent

      - name: launchd 接管 / 回退集成测试（隔离的测试标签）
        run: python3 Tests/e2e/launchd_test.py .build/debug/rclonebar-agent

      - name: 构建 .app（release, arm64）
        run: scripts/build-app.sh

      - name: 启动冒烟测试
        run: |
          export RCLONEBAR_HOME="$(mktemp -d)"
          build/RcloneBar.app/Contents/MacOS/RcloneBar &
          PID=$!
          sleep 10
          if kill -0 $PID; then echo "App 启动后保持运行"; kill $PID; else echo "App 已退出"; exit 1; fi
          build/RcloneBar.app/Contents/MacOS/rclonebar-agent version
          file build/RcloneBar.app/Contents/MacOS/RcloneBar

      - name: 界面预览截图（示例数据，浅色 / 深色）
        run: |
          export RCLONEBAR_HOME="$(mktemp -d)"
          perl -e 'alarm 90; exec @ARGV' build/RcloneBar.app/Contents/MacOS/RcloneBar --render-preview "$PWD/build/previews" || true
          ls -la build/previews || true
      - uses: actions/upload-artifact@v4
        with:
          name: RcloneBar-previews
          path: build/previews
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: RcloneBar-app
          path: build/RcloneBar.zip
          if-no-files-found: error

      - name: 在日志中输出部分预览（base64，供无法下载产物的环境查看）
        if: always()
        run: |
          mkdir -p build/previews-small
          for n in panel-active-light panel-active-dark panel-error-light settings-1-light; do
            f="build/previews/$n.png"
            [ -f "$f" ] || continue
            sips -Z 560 -s format jpeg -s formatOptions 55 "$f" --out "build/previews-small/$n.jpg" >/dev/null
            echo "PREVIEW-BEGIN $n"
            base64 -i "build/previews-small/$n.jpg" | fold -w 4000
            echo "PREVIEW-END $n"
          done
